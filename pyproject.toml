[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.1.0"
description = "Loom for agents: a walkthrough of everything your agent did"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-replay = "agent_replay.__main__:main"

[tool.setuptools]
packages = ["agent_replay"]
